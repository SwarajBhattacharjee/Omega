name: Case Omega CI - Structure, Markdown & Forensic Integrity

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-repository:
    name: Repository Verification & Integrity Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab python-docx matplotlib pandas

      - name: 1. Verify Directory & Artifact Structure
        run: |
          echo "=== Auditing Repository Structure ==="
          test -d "01_first_responder_documentation" || { echo "Missing 01_first_responder_documentation"; exit 1; }
          test -d "02_evidence_acquisition" || { echo "Missing 02_evidence_acquisition"; exit 1; }
          test -d "03_malware_analysis" || { echo "Missing 03_malware_analysis"; exit 1; }
          test -d "04_timeline_and_correlation" || { echo "Missing 04_timeline_and_correlation"; exit 1; }
          test -d "05_final_forensic_report" || { echo "Missing 05_final_forensic_report"; exit 1; }

          # Check key deliverables
          test -f "01_first_responder_documentation/SOP_First_Responder.md" || exit 1
          test -f "01_first_responder_documentation/scene_sketch_topology.svg" || exit 1
          test -f "02_evidence_acquisition/chain_of_custody_form.md" || exit 1
          test -f "02_evidence_acquisition/verification_hashes.sha256" || exit 1
          test -f "03_malware_analysis/ioc_indicators_of_compromise.csv" || exit 1
          test -f "04_timeline_and_correlation/attack_timeline.csv" || exit 1
          test -f "05_final_forensic_report/Case_Omega_Forensic_Report.pdf" || exit 1
          test -f "05_final_forensic_report/Case_Omega_Forensic_Report.docx" || exit 1
          test -f "05_final_forensic_report/Section_65B_Certificate.md" || exit 1
          echo "All critical directories and forensic deliverables verified!"

      - name: 2. Validate SHA-256 Forensic Hash Integrity
        run: |
          echo "=== Running Hash Integrity Verifier ==="
          python 02_evidence_acquisition/scripts/verify_hashes.py

      - name: 3. Validate Attack Timeline Correlation Engine
        run: |
          echo "=== Running Timeline Correlation Test ==="
          python 04_timeline_and_correlation/scripts/generate_attack_timeline.py
          test -f "04_timeline_and_correlation/attack_timeline.csv" || exit 1

      - name: 4. Markdown Formatting & Syntax Check
        run: |
          echo "=== Validating Markdown Documents ==="
          python -c '
          import glob
          md_files = glob.glob("**/*.md", recursive=True)
          print(f"Auditing {len(md_files)} markdown files for structural validity...")
          for f in md_files:
              with open(f, "r", encoding="utf-8") as fp:
                  content = fp.read()
                  assert len(content) > 50, f"File {f} is empty or too short"
          print("All Markdown documents structurally sound and non-empty.")
          '

      - name: 5. Verify PDF & DOCX Generation Scripts
        run: |
          echo "=== Testing Report Generation Pipeline ==="
          python 05_final_forensic_report/generate_report_document.py
          echo "Report generation pipeline passed!"
