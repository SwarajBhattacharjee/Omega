  <text x="545" y="510" fill="#d1d5db" font-size="10">Dell PowerEdge R750 [EVD-OMEGA-001]</text>
  <text x="545" y="528" fill="#9ca3af" font-size="10">IP: 192.168.10.100 | Port 445 Compromised</text>
