  <text x="60" y="395" fill="#e5e7eb" font-size="14" font-weight="bold">PHYSICAL CRIME SCENE: ST. JUDE MEDICAL CENTER (HOSPITAL INTRANET)</text>

  <!-- Crime Scene Room 1: Emergency Ward / Nurse Station -->
  <rect x="60" y="415" width="410" height="235" rx="8" fill="#18181b" stroke="#f43f5e" stroke-width="2"/>
  <rect x="70" y="425" width="220" height="24" rx="4" fill="#881337"/>
  <text x="75" y="442" fill="#fecdd3" font-size="11" font-weight="bold">PATIENT TRIAGE / NURSE DESK 04</text>

  <!-- Nurse Workstation 04 -->
  <rect x="80" y="465" width="180" height="85" rx="6" fill="#27272a" stroke="#f43f5e" stroke-width="2"/>
  <text x="90" y="485" fill="#fda4af" font-size="12" font-weight="bold">WS-NURSE-04 (Infected)</text>
  <text x="90" y="502" fill="#9ca3af" font-size="10">IP: 192.168.10.45</text>
  <text x="90" y="518" fill="#fca5a5" font-size="9">HP EliteDesk [EVD-OMEGA-003]</text>
  <text x="90" y="534" fill="#f43f5e" font-size="9">Status: Locked (.omega extension)</text>

