  <rect x="290" y="465" width="160" height="85" rx="6" fill="url(#alertGrad)" stroke="#ef4444" stroke-width="2" filter="url(#glow)"/>
  <text x="300" y="488" fill="#ffffff" font-size="12" font-weight="bold">PATIENT USB (VECTOR)</text>
  <text x="300" y="505" fill="#fecaca" font-size="10">SanDisk 32GB Ultra</text>
  <text x="300" y="522" fill="#fee2e2" font-size="9">Tag: EVD-OMEGA-002</text>
  <text x="300" y="538" fill="#ffffff" font-size="9">Initial Access Point</text>

  <text x="80" y="620" fill="#9ca3af" font-size="10">Physical Notes: Door open to hallway; badge card reader logged entry at 02:40 AM IST.</text>

  <!-- Crime Scene Room 2: Server Room B204 -->
  <rect x="510" y="415" width="430" height="235" rx="8" fill="#18181b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="520" y="425" width="220" height="24" rx="4" fill="#1e3a8a"/>
  <text x="525" y="442" fill="#bfdbfe" font-size="11" font-weight="bold">SERVER ROOM B204 (RESTRICTED)</text>

