  <text x="780" y="490" fill="#34d399" font-size="11" font-weight="bold">Forensic Acquisition</text>
  <text x="780" y="510" fill="#d1d5db" font-size="9">Tableau T8u Bridge</text>
  <text x="780" y="528" fill="#9ca3af" font-size="9">FTK Imager / dc3dd</text>
  <text x="780" y="546" fill="#10b981" font-size="9">Live RAM Dump Done</text>
  <text x="780" y="562" fill="#38bdf8" font-size="9">Faraday Sealed</text>

  <text x="530" y="620" fill="#9ca3af" font-size="10">Room Conditions: Temp: 19.4 C | Humidity: 38% | Badge Logs &amp; CCTV Captured.</text>

  <!-- Attack Vector Connection Lines -->
  <!-- 1. USB to Nurse Workstation -->
  <line x1="290" y1="507" x2="260" y2="507" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,2"/>
  <text x="265" y="498" fill="#ef4444" font-size="8" font-weight="bold">EXEC</text>

  <!-- 2. Nurse Workstation to Switch -->
  <path d="M 170 465 L 170 330 L 590 330 L 590 290" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="320" y="325" fill="#f43f5e" font-size="9" font-weight="bold">Lateral Spread (PsExec / SMB 445)</text>

  <!-- 3. Switch to Server Room -->
  <path d="M 640 290 L 640 465" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <text x="645" y="360" fill="#ef4444" font-size="9" font-weight="bold">Pivot Infection</text>

  <!-- 4. Firewall to External C2 -->
  <line x1="360" y1="200" x2="280" y2="200" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="295" y="193" fill="#ef4444" font-size="8">C2 Beacon</text>

  <!-- 5. Switch to Firewall -->
  <line x1="550" y1="225" x2="490" y2="225" stroke="#10b981" stroke-width="2"/>
</svg>
