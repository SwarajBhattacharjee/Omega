  <text x="55" y="135" fill="#60a5fa" font-size="14" font-weight="bold">EXTERNAL / WAN ZONE</text>
  
  <!-- Adversary C2 Node -->
  <rect x="60" y="155" width="220" height="70" rx="6" fill="#1e1e1e" stroke="#ef4444" stroke-width="2"/>
  <circle cx="85" cy="190" r="14" fill="#ef4444"/>
  <text x="80" y="195" fill="#ffffff" font-size="12" font-weight="bold">X</text>
  <text x="110" y="180" fill="#fca5a5" font-size="12" font-weight="bold">Adversary C2 Server</text>
  <text x="110" y="198" fill="#9ca3af" font-size="10">IP: 185.220.101.45 (Tor Relay)</text>
  <text x="110" y="212" fill="#ef4444" font-size="9">Domain: c2.omega-blacklock.onion</text>

  <!-- Cloud EHR & PACS Backup -->
  <rect x="60" y="245" width="220" height="75" rx="6" fill="#1e1e1e" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="75" y="270" fill="#38bdf8" font-size="12" font-weight="bold">AWS Cloud Health Gateway</text>
  <text x="75" y="288" fill="#9ca3af" font-size="10">Region: ap-south-1 (Mumbai)</text>
  <text x="75" y="304" fill="#22c55e" font-size="9">CloudWatch / S3 Audit Logs Intact</text>

  <!-- Perimeter Firewall -->
  <rect x="360" y="160" width="130" height="130" rx="10" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
  <text x="375" y="190" fill="#fbbf24" font-size="13" font-weight="bold">Perimeter FW</text>
  <text x="375" y="210" fill="#d1d5db" font-size="10">FortiGate 200F</text>
  <text x="375" y="230" fill="#9ca3af" font-size="9">EVD-OMEGA-004</text>
  <text x="375" y="250" fill="#ef4444" font-size="9">Outbound C2 Blocked</text>
  <text x="375" y="265" fill="#10b981" font-size="9">Syslog Stream Active</text>

  <!-- Core Switch -->
  <rect x="550" y="160" width="130" height="130" rx="10" fill="#1f2937" stroke="#10b981" stroke-width="2"/>
  <text x="565" y="190" fill="#34d399" font-size="13" font-weight="bold">Core Switch</text>
  <text x="565" y="210" fill="#d1d5db" font-size="10">Cisco Cat 9300</text>
  <text x="565" y="230" fill="#9ca3af" font-size="9">EVD-OMEGA-005</text>
  <text x="565" y="250" fill="#f87171" font-size="9">Port Gi1/0/14 Quarantined</text>
  <text x="565" y="265" fill="#38bdf8" font-size="9">VLAN 999 (Blackhole)</text>

